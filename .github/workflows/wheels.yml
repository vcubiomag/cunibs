name: Build wheels

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CUDA_VERSION: "12.9.1"
  CUDA_ARCHS: "60-real;70-real;75-real;80-real;86-real;89-real;90-real;100-real;120-real;120-virtual"

jobs:
  build-wheels:
    name: Build ${{ matrix.python }} ${{ matrix.platform.tag }} wheel
    runs-on: ${{ matrix.platform.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        python:
          - cp312
          - cp313
          - cp314
          - cp314t
        platform:
          - { tag: manylinux_x86_64, runs-on: ubuntu-24.04 }
          - { tag: win_amd64, runs-on: windows-2025 }

    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"

      - name: Install CUDA ${{ env.CUDA_VERSION }}
        run: python .github/scripts/fetch_cuda.py ${{ env.CUDA_VERSION }} ${{ runner.temp }}/cuda

      # CTK 12.9 rejects MSVC 14.50 and later, so take the VS 2022 toolset that the VS 2026
      # image also ships.
      - uses: step-security/msvc-dev-cmd@v1.13.1
        if: runner.os == 'Windows'
        with:
          arch: x64
          toolset: "14.44"

      - uses: pypa/cibuildwheel@v4.3.5
        env:
          CIBW_BUILD: ${{ matrix.python }}-${{ matrix.platform.tag }}
          CIBW_CONFIG_SETTINGS: cmake.define.CMAKE_CUDA_ARCHITECTURES=${{ env.CUDA_ARCHS }}
          CIBW_ENVIRONMENT_LINUX: CUDACXX=/host${{ runner.temp }}/cuda/bin/nvcc
          CIBW_ENVIRONMENT_WINDOWS: >-
            CMAKE_GENERATOR=Ninja
            CUDACXX='${{ runner.temp }}/cuda/bin/nvcc.exe'
          CIBW_TEST_SOURCES: .github/scripts/import_extension.py
          CIBW_TEST_COMMAND: python .github/scripts/import_extension.py

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: wheels-${{ matrix.python }}-${{ matrix.platform.tag }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  build-sdist:
    name: Build sdist
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v8.2.0
      - run: uv build --sdist

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: wheels-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    environment:
      name: pypi
      url: https://pypi.org/p/cunibs
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
