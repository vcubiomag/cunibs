[project]
name = "cunibs"
version = "0.5.0"
description = "GPU FEM solver for the TMS E-field"
readme = "README.md"
keywords = [
    "transcranial magnetic stimulation",
    "TMS",
    "finite element method",
    "FEM",
    "CUDA",
    "GPU",
    "TMS simulation"
]
authors = [
    { name = "Sriman Achanta", email = "achantass@vcu.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "cuda-core>=1.3.1,<2",
    "h5py>=3.10.0",
    "numpy>=2.0",
]
license = "GPL-3.0-only"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Repository = "https://github.com/vcubiomag/cunibs"
Documentation = "https://vcubiomag.github.io/cunibs/"

[project.optional-dependencies]
cu12 = [
    "cuda-core[minimal-sysctk12]>=1.3.1,<2",
    "cupy-cuda12x[ctk]>=14.0.0",
]
cu13 = [
    "cuda-core[minimal-sysctk13]>=1.3.1,<2",
    "cupy-cuda13x[ctk]>=14.0.0",
]
cu12-local = [
    "cuda-core[minimal-sysctk12]>=1.3.1,<2",
    "cupy-cuda12x>=14.0.0",
]
cu13-local = [
    "cuda-core[minimal-sysctk13]>=1.3.1,<2",
    "cupy-cuda13x>=14.0.0",
]

[build-system]
requires = [
    "scikit-build-core>=0.12",
    "nanobind>=2.13.0",
]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.exclude = ["**.cpp", "**.cu", "**.hpp", "**.cuh"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib --durations=15"
xfail_strict = true
markers = [
    "gpu: requires a CUDA device",
    "slow: multi-second test",
    "realmesh: requires tests/data/head_patch_r25.msh.gz",
    "reference: requires the full head mesh via CUNIBS_REFERENCE_MESH",
]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "src/**/*.{h,c,cu,cuh,hpp,cpp}" },
    { file = "CMakeLists.txt" },
]
conflicts = [
    [
        { extra = "cu12" },
        { extra = "cu13" },
        { extra = "cu12-local" },
        { extra = "cu13-local" },
    ],
]

[tool.ruff]
line-length = 96
target-version = "py312"

[tool.ruff.lint]
extend-select = [
    "I",
    "B",
    "PERF",
    "ARG",
    "RUF",
    "S",
    "N",
    "UP",
    "C4",
    "FA",
    "ISC",
    "ICN",
    "RET",
    "SIM",
    "TID",
    "TC",
    "PTH",
    "TD",
    "NPY",
    "A",
]
ignore = [
    "RUF002",
    "RUF003",
    "RUF005",
    "S101",
    "N806",
    "N803",
    "N815",
    "N802",
]

[tool.ruff.lint.per-file-ignores]
"benchmarks/*" = ["S603", "S606", "S607"]
"benchmarks/simnibs_child.py" = ["ARG001"]
