[project]
name = "cunibs"
version = "0.2.0"
description = "GPU FEM solver for the TMS E-field"
readme = "README.md"
keywords = [
    "transcranial magnetic stimulation",
    "TMS",
    "finite element method",
    "FEM",
    "CUDA",
    "GPU",
    "TMS simulation"
]
authors = [
    { name = "Sriman Achanta" }
]
requires-python = ">=3.12"
dependencies = [
    "cuda-pathfinder>=1.5,<2",
    "cuda-toolkit[cudart]>=13.0,<14",
    "cupy-cuda13x>=14.0.0",
    "h5py>=3.10.0",
    "numpy>=1.26.0",
]
license = "GPL-3.0-only"
license-files = ["LICENSE"]

[project.urls]
Repository = "https://github.com/vcubiomag/cunibs"

[build-system]
requires = [
    "scikit-build-core>=0.12",
    "nanobind>=2.13.0",
    "cuda-pathfinder>=1.5,<2",
    # cccl carries nv/target, which cuda_fp16.h includes; vcycle.hpp stores its operator
    # as __half.
    "cuda-toolkit[nvcc,cudart,cccl]==13.2.*"
]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.exclude = ["**.cpp", "**.cu", "**.hpp", "**.cuh"]

# Left to itself, scikit-build-core picks the Visual Studio generator, which compiles
# CUDA through MSBuild's CUDA toolset rather than CMAKE_CUDA_COMPILER. That toolset only
# ships with the system CUDA installer, so with the toolkit coming from wheels
# enable_language(CUDA) fails with "No CUDA toolset found". Ninja needs cl.exe on PATH,
# i.e. a developer shell locally and ilammy/msvc-dev-cmd in CI.
[[tool.scikit-build.overrides]]
if.platform-system = "win32"
cmake.args = ["-GNinja"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["tools"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib --durations=15"
xfail_strict = true
markers = [
    "gpu: requires a CUDA device",
    "slow: multi-second test",
    "realmesh: requires tests/data/head_patch_r25.msh.gz",
    "reference: requires the full head mesh via CUNIBS_REFERENCE_MESH",
]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "src/**/*.{h,c,cu,cuh,hpp,cpp}" },
    { file = "CMakeLists.txt" },
    { file = "cmake/*.{cmake,py}" },
]

[tool.ruff]
line-length = 96
target-version = "py312"

[tool.ruff.lint]
extend-select = [
    "I",
    "B",
    "PERF",
    "ARG",
    "RUF",
    "S",
    "N",
    "UP",
    "C4",
    "FA",
    "ISC",
    "ICN",
    "RET",
    "SIM",
    "TID",
    "TC",
    "PTH",
    "TD",
    "NPY",
    "A",
]
ignore = [
    "RUF002",
    "RUF003",
    "RUF005",
    "S101",
    "N806",
    "N803",
    "N815",
    "N802",
]
